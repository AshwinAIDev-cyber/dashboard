openapi: 3.1.0
info:
  title: NEXUS Command Center API
  version: 1.0.0
  description: >
    Backend for the NEXUS personal command center — tasks, goals, Google
    Calendar + Gmail sync, and the FRIDAY AI assistant. All routes are served
    under the `/api` prefix.
servers:
  - url: /api
tags:
  - name: health
  - name: tasks
  - name: goals
  - name: calendar
  - name: email
  - name: friday

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks (open first, newest first)
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List all goals
      responses:
        "200":
          description: Goal list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"

  /goals/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal (progress is clamped to 0..target)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalBody"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /calendar/events:
    get:
      operationId: listCalendarEvents
      tags: [calendar]
      summary: Upcoming events from the primary Google Calendar
      parameters:
        - name: days
          in: query
          required: false
          description: How many days ahead to look (1-60)
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
      responses:
        "200":
          description: Events ordered by start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"
    post:
      operationId: createCalendarEvent
      tags: [calendar]
      summary: Create an event on the primary Google Calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"

  /calendar/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    delete:
      operationId: deleteCalendarEvent
      tags: [calendar]
      summary: Delete an event from the primary Google Calendar
      responses:
        "204":
          description: Deleted
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"

  /email/messages:
    get:
      operationId: listEmailMessages
      tags: [email]
      summary: Recent inbox messages from Gmail
      parameters:
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 15
      responses:
        "200":
          description: Inbox summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailSummary"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"

  /email/messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getEmailMessage
      tags: [email]
      summary: Full Gmail message
      responses:
        "200":
          description: Message with decoded body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessage"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"

  /email/send:
    post:
      operationId: sendEmail
      tags: [email]
      summary: Send a plain-text email through Gmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailBody"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"

  /friday/status:
    get:
      operationId: getFridayStatus
      tags: [friday]
      summary: Whether the FRIDAY AI core is configured
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FridayStatus"

  /friday/chat:
    post:
      operationId: fridayChat
      tags: [friday]
      summary: Send the conversation to FRIDAY and get her reply
      description: >
        FRIDAY sees a live snapshot of tasks, goals and (when connected) today's
        calendar. She can create/complete tasks and create/advance goals; any
        changes she makes are listed in `actions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FridayChatBody"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FridayChatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/IntegrationUnavailable"

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IntegrationUnavailable:
      description: An external integration (Google, AI) is not connected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    TaskPriority:
      type: string
      enum: [alpha, beta, gamma]
      description: Mission rank — alpha (critical), beta (standard), gamma (side-quest)

    Task:
      type: object
      required: [id, title, completed, priority, createdAt, completedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
        priority:
          $ref: "#/components/schemas/TaskPriority"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time

    CreateTaskBody:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        priority:
          $ref: "#/components/schemas/TaskPriority"

    UpdateTaskBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        completed:
          type: boolean
        priority:
          $ref: "#/components/schemas/TaskPriority"

    GoalType:
      type: string
      enum: [yearly, monthly, weekly]

    Goal:
      type: object
      required: [id, title, type, progress, target, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          $ref: "#/components/schemas/GoalType"
        progress:
          type: integer
        target:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateGoalBody:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: "#/components/schemas/GoalType"
        target:
          type: integer
          minimum: 1
          maximum: 100000
        progress:
          type: integer
          minimum: 0

    UpdateGoalBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: "#/components/schemas/GoalType"
        progress:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 1
          maximum: 100000

    CalendarEvent:
      type: object
      required: [id, summary, start, end, allDay]
      properties:
        id:
          type: string
        summary:
          type: string
        description:
          type: [string, "null"]
        location:
          type: [string, "null"]
        start:
          type: string
          description: ISO date-time, or YYYY-MM-DD for all-day events
        end:
          type: string
          description: ISO date-time, or YYYY-MM-DD for all-day events
        allDay:
          type: boolean
        htmlLink:
          type: [string, "null"]

    CreateCalendarEventBody:
      type: object
      required: [summary, start, end]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 5000
        location:
          type: string
          maxLength: 500
        start:
          type: string
          description: ISO date-time (or YYYY-MM-DD when allDay)
        end:
          type: string
          description: ISO date-time (or YYYY-MM-DD when allDay)
        allDay:
          type: boolean
        timeZone:
          type: string
          description: IANA zone of the operator, e.g. America/Los_Angeles

    EmailSummary:
      type: object
      required: [id, threadId, from, fromName, subject, snippet, date, unread]
      properties:
        id:
          type: string
        threadId:
          type: string
        from:
          type: string
          description: Sender address
        fromName:
          type: string
          description: Sender display name (falls back to the address)
        subject:
          type: string
        snippet:
          type: string
        date:
          type: string
          description: ISO date-time the message was received
        unread:
          type: boolean

    EmailMessage:
      type: object
      required: [id, threadId, from, fromName, to, subject, snippet, date, unread, body]
      properties:
        id:
          type: string
        threadId:
          type: string
        from:
          type: string
        fromName:
          type: string
        to:
          type: string
        subject:
          type: string
        snippet:
          type: string
        date:
          type: string
        unread:
          type: boolean
        body:
          type: string
          description: Plain-text body (HTML converted to text when no text part exists)

    SendEmailBody:
      type: object
      required: [to, subject, body]
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 1
          maxLength: 20000
        threadId:
          type: string
          description: Reply within an existing Gmail thread
        inReplyTo:
          type: string
          description: Gmail message id being replied to

    SendEmailResult:
      type: object
      required: [id]
      properties:
        id:
          type: string
        threadId:
          type: string

    FridayStatus:
      type: object
      required: [online, model]
      properties:
        online:
          type: boolean
        model:
          type: string

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 8000

    FridayChatBody:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        timeZone:
          type: string
          description: IANA zone of the operator so FRIDAY can reason about "today"

    FridayAction:
      type: object
      required: [type, summary]
      properties:
        type:
          type: string
          enum: [task_created, task_updated, goal_created, goal_updated]
        summary:
          type: string

    FridayChatResponse:
      type: object
      required: [reply, actions]
      properties:
        reply:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/FridayAction"
